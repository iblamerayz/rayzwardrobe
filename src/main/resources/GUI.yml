# RayzWardrobe GUI
# All materials are optional. If a value is missing or invalid, the plugin falls back safely.

inventory:
  # Must be a multiple of 9.
  size: 54

  # Number of wardrobe columns shown per page.
  sets-per-page: 7

  items:
    background:
      use-theme: true
      material: "BLACK_STAINED_GLASS_PANE"

    previous-page:
      slot: 45
      material: "ARROW"
      disabled-material: "BARRIER"

    next-page:
      slot: 53
      material: "ARROW"
      disabled-material: "BARRIER"

    page-info:
      slot: 0
      material: "BOOK"

    themes-button:
      slot: 8
      material: "NETHER_STAR"

    admin-back-button:
      slot: 8
      material: "ARROW"

    nameplate:
      material: "NAME_TAG"
      empty-material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      locked-material: "BARRIER"

    armor:
      empty-material: "GRAY_STAINED_GLASS_PANE"
      empty-preview-material: "LIGHT_GRAY_STAINED_GLASS_PANE"
      locked-material: "BARRIER"

    tool:
      empty-material: "ITEM_FRAME"

    actions:
      save-material: "WRITABLE_BOOK"
      save-tools-material: "CHEST"
      equip-material: "LIME_DYE"
      inspect-material: "ENDER_EYE"
      empty-material: "GRAY_STAINED_GLASS_PANE"
      locked-material: "BARRIER"

  # Define the exact slots for each wardrobe set.
  # Optional tool-1/tool-2 slots can be enabled by setting them to valid GUI slots.
  set-layout:
    1:
      nameplate: 1
      helmet: 10
      chestplate: 19
      leggings: 28
      boots: 37
      action: 46
      tool-1: -1
      tool-2: -1
    2:
      nameplate: 2
      helmet: 11
      chestplate: 20
      leggings: 29
      boots: 38
      action: 47
      tool-1: -1
      tool-2: -1
    3:
      nameplate: 3
      helmet: 12
      chestplate: 21
      leggings: 30
      boots: 39
      action: 48
      tool-1: -1
      tool-2: -1
    4:
      nameplate: 4
