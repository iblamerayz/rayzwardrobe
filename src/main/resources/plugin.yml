name: RayzWardrobe
version: '${version}'
main: org.rayz.rayzWardrobe.RayzWardrobe
api-version: '1.21'
softdepend: [PlaceholderAPI, ItemsAdder, Oraxen, Nexo, MMOItems, MythicMobs, MythicCrucible, EcoItems, ExecutableItems]

commands:
  wardrobe:
    description: Main wardrobe command with subcommands
    usage: /wardrobe [help|credits|themes|view|reload]
    aliases: [wd, rw]
  rwreload:
    description: Reload the RayzWardrobe configuration
    usage: /rwreload
    permission: rayzwardrobe.reload

permissions:
  rayzwardrobe.use:
    description: Allows opening your own wardrobe
    default: true
  rayzwardrobe.themes:
    description: Allows opening the theme selector
    default: true
  rayzwardrobe.reload:
    description: Allows reloading the plugin configuration
    default: op
  rayzwardrobe.admin.view:
    description: Allows viewing another online player's wardrobe
    default: op
  rayzwardrobe.admin:
    description: Grants all RayzWardrobe administration permissions
    default: op
    children:
      rayzwardrobe.use: true
      rayzwardrobe.themes: true
      rayzwardrobe.reload: true
      rayzwardrobe.admin.view: true
      rayzwardrobe.use.page.*: true
      rayzwardrobe.use.slot.*: true
  rayzwardrobe.use.page.*:
    description: Allows access to every wardrobe page
    default: false
  rayzwardrobe.page.*:
    description: Alias allowing access to every wardrobe page
    default: false
  rayzwardrobe.use.slot.*:
    description: Allows access to every restricted wardrobe slot
    default: false
  rayzwardrobe.slot.*:
    description: Alias allowing access to every restricted wardrobe slot
    default: false
